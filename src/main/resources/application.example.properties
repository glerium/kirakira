# Copy this file to runtime/application.properties on the deployment server.
# Never commit the copied file.

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/kirakira?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=your_mysql_username
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath:mybatis/mapper/*.xml
mybatis.type-aliases-package=com.kirakira.entity
mybatis.configuration.map-underscore-to-camel-case=true
